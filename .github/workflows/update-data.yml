name: Update Data & Regenerate Map

on:
  schedule:
    - cron: '0 1,13 * * *'   # 2x sehari: jam 08.00 & 20.00 WIB (UTC+7)
  workflow_dispatch:           # bisa trigger manual dari GitHub UI

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect data (scraping berita + data resmi)
        run: python src/collect_official.py && python src/collect_news.py

      - name: Process & build database
        run: python src/process.py

      - name: Run sentiment analysis
        run: python src/sentiment.py

      - name: Generate map HTML
        run: python generate_map.py

      - name: Commit & push hasil
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/ data/processed/ docs/index.html
          git diff --cached --quiet || git commit -m "chore: auto-update data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
